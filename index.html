<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tihvert</title>
  <meta name="description" content="Tihvert. Writes code, breaks code, occasionally fixes it.">
  <meta name="theme-color" content="#09090b">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2309090b'/><text x='50%' y='56%' text-anchor='middle' dominant-baseline='middle' font-family='monospace' font-weight='700' font-size='36' fill='%23e4e4e7'>T</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card: rgba(18, 18, 22, 0.72);
      --line: rgba(255, 255, 255, 0.08);
      --text: #e4e4e7;
      --muted: #8b8b94;
      --accent: #c4b5fd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
      display: grid; place-items: center;
      padding: 24px 16px;
      overflow: hidden;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    /* click-to-enter gate */
    #gate {
      position: fixed; inset: 0; z-index: 5;
      display: grid; place-items: center;
      background: var(--bg);
      cursor: pointer;
      transition: opacity .6s ease;
      color: var(--muted); font-size: 14px; letter-spacing: .08em;
    }
    #gate.gone { opacity: 0; pointer-events: none; }
    .blink::after { content: "_"; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    main {
      position: relative; z-index: 1;
      width: 100%; max-width: 380px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px 24px 22px;
      backdrop-filter: blur(10px);
      text-align: center;
      opacity: 0; transform: translateY(24px);
    }
    main.in { animation: slideup .7s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes slideup { to { opacity: 1; transform: none; } }

    .avatar {
      width: 88px; height: 88px; margin: 0 auto 16px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 36px; font-weight: 800;
      background: radial-gradient(circle at 30% 25%, #2a2a33, #111114);
      border: 1px solid var(--line);
      cursor: pointer; user-select: none;
      transition: transform .25s ease;
    }
    .avatar:hover { transform: rotate(-8deg) scale(1.04); }
    .avatar.spin { animation: spin .8s ease; }
    @keyframes spin { to { transform: rotate(720deg); } }

    h1 { font-size: 24px; font-weight: 800; letter-spacing: .02em; }
    .typed { margin-top: 8px; min-height: 1.5em; color: var(--muted); font-size: 13px; }
    .typed::after { content: "▍"; color: var(--accent); margin-left: 1px; animation: blink 1s steps(1) infinite; }

    .meta { margin-top: 14px; font-size: 12px; color: var(--muted); display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }

    .icons { display: flex; justify-content: center; gap: 12px; margin-top: 22px; }
    .icons a {
      width: 44px; height: 44px; display: grid; place-items: center;
      border-radius: 12px; border: 1px solid var(--line);
      color: var(--text); background: rgba(255,255,255,.02);
      transition: transform .15s, border-color .15s, color .15s;
    }
    .icons a:hover, .icons a:focus-visible { transform: translateY(-3px); border-color: var(--accent); color: var(--accent); outline: none; }
    .icons svg { width: 20px; height: 20px; fill: currentColor; }
    .icons a[hidden] { display: none; }

    .egg { margin-top: 18px; font-size: 11px; color: #52525b; min-height: 1.4em; }

    @media (prefers-reduced-motion: reduce) {
      main.in { animation: none; opacity: 1; transform: none; }
      .avatar.spin { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div id="gate" role="button" tabindex="0" aria-label="Enter"><span class="blink">click to enter</span></div>

  <main id="card">
    <div class="avatar" id="avatar" title="don't click me">T</div>
    <h1>Tihvert</h1>
    <p class="typed" id="typed"></p>

    <div class="meta">
      <span>📍 Finland</span>
      <span id="clock">--:--</span>
    </div>

    <nav class="icons">
      <a href="https://discord.com/users/1015157576687698030" target="_blank" rel="noopener" aria-label="Discord" title="Discord">
        <svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.3 18.3 0 0 0-5.5 0L8.6 3a19.7 19.7 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1a19.9 19.9 0 0 0 6 3l1.3-2a12.8 12.8 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4a12.9 12.9 0 0 1-2 1l1.3 2a19.8 19.8 0 0 0 6-3c.5-5.2-.9-9.7-3.6-13.7ZM8 15.4c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.6 8 10.6s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>
      </a>
      <a href="https://github.com/Tihvert" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
        <svg viewBox="0 0 24 24"><path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.6 18.3 5 18.3 5c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5Z"/></svg>
      </a>
      <a id="yt" href="#" target="_blank" rel="noopener" aria-label="YouTube" title="YouTube" hidden>
        <svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg>
      </a>
    </nav>

    <p class="egg" id="egg"></p>
  </main>

  <script>
    // Set your channel here, e.g. "https://www.youtube.com/@yourhandle". Empty = icon hidden.
    var YOUTUBE_URL = "";
    if (YOUTUBE_URL) { var yt = document.getElementById('yt'); yt.href = YOUTUBE_URL; yt.hidden = false; }

    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // gate
    var gate = document.getElementById('gate'), card = document.getElementById('card');
    function enter() { gate.classList.add('gone'); card.classList.add('in'); startTyping(); }
    gate.addEventListener('click', enter);
    gate.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') enter(); });

    // typewriter
    var lines = ['writes code.', 'breaks code.', 'fixes the code that broke.', 'debugging at 3am.', 'probably asleep.', 'touching grass (rarely).'];
    var el = document.getElementById('typed'), li = 0, ci = 0, del = false, started = false;
    function startTyping() { if (started) return; started = true; if (reduce) { el.textContent = lines[0]; return; } tick(); }
    function tick() {
      var s = lines[li];
      el.textContent = s.slice(0, ci);
      if (!del && ci < s.length) { ci++; setTimeout(tick, 70); }
      else if (!del) { del = true; setTimeout(tick, 1600); }
      else if (ci > 0) { ci--; setTimeout(tick, 35); }
      else { del = false; li = (li + 1) % lines.length; setTimeout(tick, 300); }
    }

    // Helsinki clock
    var clock = document.getElementById('clock');
    function t() { clock.textContent = '🕒 ' + new Date().toLocaleTimeString('en-GB', { timeZone: 'Europe/Helsinki', hour: '2-digit', minute: '2-digit' }); }
    t(); setInterval(t, 10000);

    // avatar easter egg
    var clicks = 0, egg = document.getElementById('egg'), av = document.getElementById('avatar');
    var msgs = ['', 'hey.', 'stop that.', 'seriously.', 'ok fine.', 'wheee'];
    av.addEventListener('click', function () {
      clicks++;
      egg.textContent = msgs[Math.min(clicks, msgs.length - 1)];
      if (clicks >= 5) { av.classList.remove('spin'); void av.offsetWidth; av.classList.add('spin'); clicks = 0; setTimeout(function () { egg.textContent = ''; }, 1500); }
    });

    // drifting particles
    var c = document.getElementById('bg'), x = c.getContext('2d'), P = [], W, H;
    function size() { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; }
    size(); addEventListener('resize', size);
    for (var i = 0; i < 60; i++) P.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + .4, v: Math.random() * .0006 + .0002, o: Math.random() * .5 + .15 });
    function draw() {
      x.clearRect(0, 0, W, H);
      P.forEach(function (p) {
        p.y += p.v; if (p.y > 1) { p.y = 0; p.x = Math.random(); }
        x.beginPath(); x.arc(p.x * W, p.y * H, p.r * devicePixelRatio, 0, 6.3);
        x.fillStyle = 'rgba(196,181,253,' + p.o + ')'; x.fill();
      });
      if (!reduce) requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
