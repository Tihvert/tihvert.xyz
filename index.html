<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tihvert</title>
  <meta name="description" content="Tihvert. Writes code, breaks code, occasionally fixes it.">
  <!-- theme-color doubles as the colour bar of the Discord link embed -->
  <meta name="theme-color" content="#5b21b6">
  <link rel="canonical" href="https://tihvert.xyz/">
  <!-- link previews (Discord, Telegram, X, ...) -->
  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="tihvert.xyz">
  <meta property="og:url" content="https://tihvert.xyz/">
  <meta property="og:title" content="Tihvert">
  <meta property="og:description" content="Writes code, breaks code, occasionally fixes it. 📍 Finland">
  <meta property="og:image" content="https://tihvert.xyz/avatar.png">
  <meta property="og:image:width" content="256">
  <meta property="og:image:height" content="256">
  <meta property="og:image:alt" content="Tihvert's avatar">
  <meta name="twitter:card" content="summary">
  <link rel="icon" id="favicon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050507;
      --card: rgba(10, 10, 14, 0.72);
      --line: rgba(255, 255, 255, 0.09);
      --text: #e4e4e7;
      --muted: #8b8b98;
      --faint: #5a5a66;
      --accent: #c4b5fd;
      --aur1: #6ee7b7;
      --aur2: #a78bfa;
      --aur3: #7dd3fc;
      --online: #22c55e;
      --idle: #f5b33b;
      --dnd: #ef4444;
      --offline: #6b6b76;
      --spotify: #1ed760;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html { height: 100%; }
    body {
      min-height: 100%;
      background: radial-gradient(120% 80% at 50% 0%, #090a10 0%, var(--bg) 60%) var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
      display: grid; place-items: center; grid-template-columns: minmax(0, 1fr);
      padding: 24px 16px 104px;
      overflow-x: hidden;
    }
    #aurora, #bg, #rain, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #aurora { z-index: 0; filter: blur(18px); opacity: .3; transition: opacity 4s ease; }
    #bg { z-index: 0; transition: opacity 4s ease; }
    #rain { z-index: 0; }
    #fx { z-index: 55; }

    /* click-to-enter gate */
    #gate {
      position: fixed; inset: 0; z-index: 5;
      display: grid; place-items: center;
      background: rgba(5, 5, 7, .8);
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: opacity .7s ease;
      color: var(--muted); font-size: 14px; letter-spacing: .08em;
    }
    #gate.gone { opacity: 0; pointer-events: none; }
    .blink::after { content: "_"; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .stage { position: relative; z-index: 1; width: 100%; max-width: 400px; min-width: 0; opacity: 0; transform: translateY(24px); }
    .stage.in { animation: slideup .8s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes slideup { to { opacity: 1; transform: none; } }

    main {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 30px 22px 20px;
      backdrop-filter: blur(14px);
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45), 0 0 50px rgba(167, 139, 250, .07);
      will-change: transform;
    }
    main::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: radial-gradient(420px circle at var(--gx, 50%) var(--gy, -10%), rgba(255, 255, 255, .08), transparent 45%);
    }

    /* avatar + live status dot */
    .av-wrap { position: relative; width: 96px; height: 96px; margin: 0 auto 14px; }
    .avatar {
      width: 96px; height: 96px;
      border-radius: 50%;
      border: 2px solid var(--line);
      box-shadow: 0 0 0 4px rgba(196, 181, 253, .10), 0 8px 30px rgba(0,0,0,.5);
      cursor: pointer; user-select: none; display: block; object-fit: cover;
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .avatar:hover { transform: rotate(-8deg) scale(1.04); box-shadow: 0 0 0 4px rgba(196, 181, 253, .25), 0 8px 30px rgba(0,0,0,.5); }
    .avatar.spin { animation: spin .8s ease; }
    .avatar.poke { animation: poke .3s ease; }
    @keyframes poke { 30% { transform: scale(.88) rotate(-10deg); } 65% { transform: scale(1.08) rotate(6deg); } }
    @keyframes spin { to { transform: rotate(720deg); } }
    .sdot {
      position: absolute; right: 2px; bottom: 4px;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--offline); border: 4px solid #0a0a0e;
      transition: background .3s, box-shadow .3s;
    }
    .sdot.online { background: var(--online); box-shadow: 0 0 12px rgba(34, 197, 94, .55); }
    .sdot.idle { background: var(--idle); box-shadow: 0 0 12px rgba(245, 179, 59, .45); }
    .sdot.dnd { background: var(--dnd); box-shadow: 0 0 12px rgba(239, 68, 68, .45); }

    /* glowing name with sparkles */
    .name-wrap { position: relative; display: inline-block; padding: 0 6px; }
    h1 {
      font-size: 27px; font-weight: 800; letter-spacing: .03em;
      background: linear-gradient(90deg, var(--accent), var(--aur1), var(--aur3), var(--aur2), var(--accent));
      background-size: 300% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 10px rgba(167, 139, 250, .55));
      animation: sheen 7s linear infinite;
    }
    @keyframes sheen { to { background-position: 300% 0; } }
    .sparkle {
      position: absolute; pointer-events: none; color: #fff; font-size: 10px; line-height: 1;
      text-shadow: 0 0 6px var(--accent), 0 0 12px var(--aur2);
      animation: sparkle 1.1s ease-out forwards;
    }
    @keyframes sparkle {
      0% { opacity: 0; transform: scale(0) rotate(0deg); }
      30% { opacity: 1; transform: scale(1) rotate(60deg); }
      100% { opacity: 0; transform: translateY(-8px) scale(.4) rotate(140deg); }
    }

    .cstatus { margin-top: 6px; font-size: 12px; color: var(--text); opacity: .85; display: flex; gap: 6px; justify-content: center; align-items: center; min-height: 1.4em; }
    .cstatus img { width: 16px; height: 16px; }
    .typed { margin-top: 6px; min-height: 1.5em; color: var(--muted); font-size: 13px; }
    .typed::after { content: "▍"; color: var(--accent); margin-left: 1px; animation: blink 1s steps(1) infinite; }

    .meta { margin-top: 12px; font-size: 12px; color: var(--muted); display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
    .st::first-letter { color: var(--offline); }
    .st.online::first-letter { color: var(--online); }
    .st.idle::first-letter { color: var(--idle); }
    .st.dnd::first-letter { color: var(--dnd); }

    /* live Discord presence */
    .presence { margin-top: 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; text-align: left; }
    .pcard {
      display: flex; gap: 12px; align-items: center;
      padding: 10px; border: 1px solid var(--line); border-radius: 14px;
      background: rgba(255, 255, 255, .025);
    }
    .pimg, .picon { width: 52px; height: 52px; border-radius: 10px; flex: none; }
    .pimg { object-fit: cover; background: rgba(255, 255, 255, .04); }
    .picon { display: grid; place-items: center; background: rgba(196, 181, 253, .08); color: var(--accent); }
    .picon svg { width: 24px; height: 24px; fill: currentColor; }
    .ptxt { min-width: 0; flex: 1; }
    .pkind { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .pname, .psub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pname { font-size: 13px; font-weight: 600; margin-top: 2px; }
    .psub { font-size: 11px; color: var(--muted); }
    .ptime { font-size: 10px; color: var(--accent); margin-top: 3px; font-variant-numeric: tabular-nums; }
    .spot .pkind { color: var(--spotify); }
    .pbar { height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .08); margin-top: 6px; overflow: hidden; }
    .pbar i { display: block; height: 100%; width: 0; background: var(--spotify); transition: width 1s linear; }
    .ptimes { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
    .pidle { font-size: 11px; color: var(--faint); text-align: center; padding: 4px 0; }
    /* this week's playtime: one stacked bar per day, top games coloured */
    .pcard.week { display: block; padding: 10px 12px; }
    .whead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .whead .ptime { margin-top: 0; }
    .wbars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
    .wcol { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
    .wbar { width: 100%; max-width: 22px; height: 44px; display: flex; flex-direction: column-reverse; border-radius: 4px; overflow: hidden; background: rgba(255, 255, 255, .07); }
    .wbar i { display: block; width: 100%; flex: none; transition: height .6s ease; }
    .wday { font-size: 10px; color: var(--muted); }
    .wday.now { color: var(--accent); font-weight: 600; }
    .wcol.future { opacity: .55; }
    .wlegend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .wlegend span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .wlegend b { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    .wlegend img { width: 16px; height: 16px; border-radius: 4px; margin-right: 5px; vertical-align: middle; object-fit: cover; }

    .icons { display: flex; justify-content: center; gap: 12px; margin-top: 20px; }
    .icons a {
      width: 44px; height: 44px; display: grid; place-items: center;
      border-radius: 12px; border: 1px solid var(--line);
      color: var(--text); background: rgba(255,255,255,.02);
      transition: transform .15s, border-color .15s, color .15s, box-shadow .15s;
    }
    .icons a:hover, .icons a:focus-visible { transform: translateY(-3px); border-color: var(--accent); color: var(--accent); box-shadow: 0 6px 20px rgba(167, 139, 250, .18); outline: none; }
    .icons svg { width: 20px; height: 20px; fill: currentColor; }

    .egg { margin-top: 10px; min-height: 1.9em; font-size: 13px; font-weight: 600; color: var(--accent); }
    .egg:not(:empty) { display: inline-block; padding: 4px 12px; border-radius: 12px; background: rgba(196, 181, 253, .12);
                       border: 1px solid rgba(196, 181, 253, .35); animation: eggpop .25s ease; }
    @keyframes eggpop { from { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.1); } }

    /* small confirmation bubble ("discord username copied") */
    #toast {
      position: fixed; left: 50%; bottom: 84px; z-index: 6;
      transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
      padding: 8px 14px; border-radius: 12px; font-size: 12px; color: var(--text);
      background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(10px);
      transition: opacity .25s ease, transform .25s ease;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast b { color: var(--accent); font-weight: 600; }

    /* hidden terminal: ~ / ` / § key or the faint >_ button */
    #termBtn {
      position: fixed; left: 16px; bottom: 16px; z-index: 4;
      font: 600 11px 'JetBrains Mono', ui-monospace, monospace; color: var(--faint);
      background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; cursor: pointer;
    }
    #termBtn:hover, #termBtn:focus-visible { color: var(--accent); border-color: var(--line); outline: none; }
    @media (max-width: 480px) { #termBtn { bottom: 78px; } }  /* the player spans the bottom on phones */
    #term {
      position: fixed; left: 50%; top: 50%; z-index: 7; transform: translate(-50%, -50%);
      width: min(640px, calc(100% - 32px)); height: min(420px, calc(100% - 120px));
      display: flex; flex-direction: column;
      background: rgba(5, 5, 9, .92); border: 1px solid var(--line); border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 0 1px rgba(196, 181, 253, .08);
      backdrop-filter: blur(16px); font: 12px/1.55 'JetBrains Mono', ui-monospace, monospace; color: var(--text);
    }
    #term[hidden] { display: none; }
    .t-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .t-bar button { background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; line-height: 1; }
    .t-bar button:hover { color: var(--accent); }
    .t-out { flex: 1; overflow: auto; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; min-height: 0; }
    .t-out .c { color: var(--accent); }
    .t-out .m { color: var(--muted); }
    .t-out .g { color: var(--aur1); }
    .t-in { display: flex; gap: 8px; padding: 8px 12px 12px; align-items: center; }
    .t-ps { color: var(--aur1); flex: none; }
    .t-in input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--text); font: inherit; caret-color: var(--accent); }

    /* music player */
    #player {
      position: fixed; right: 16px; bottom: 16px; z-index: 4;
      width: 300px; max-width: calc(100% - 32px);
      display: none; flex-direction: column; gap: 8px;
      padding: 10px 12px;
      font-size: 11px; color: var(--muted);
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      backdrop-filter: blur(14px);
    }
    #player.show { display: flex; }
    .pl-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .pl-ctrl { display: flex; align-items: center; gap: 6px; }
    .pl-vol { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--muted); }
    .pl-vol svg { width: 14px; height: 14px; fill: currentColor; }
    #pp {
      width: 34px; height: 34px; flex: none; border-radius: 50%;
      display: grid; place-items: center; cursor: pointer;
      color: var(--text); background: rgba(255, 255, 255, .04); border: 1px solid var(--line);
    }
    #pp:hover, #pp:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }
    #pp svg { width: 14px; height: 14px; fill: currentColor; }
    .pl-art { width: 40px; height: 40px; flex: none; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); }
    .pl-info { flex: 1; min-width: 0; }
    .pl-title { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 12px; }
    /* song name: ellipsis by default, scrolls in a seamless loop when it does not fit */
    .pl-name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .pl-name.scroll {
      text-overflow: clip;
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 14px), transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 14px), transparent 100%);
    }
    .pl-track { display: inline-block; }
    .pl-name.scroll .pl-track { animation: marquee var(--mq-dur, 10s) linear infinite; }
    #player.paused .pl-name.scroll .pl-track { animation-play-state: paused; }
    @keyframes marquee { 0%, 15% { transform: translateX(0); } 100% { transform: translateX(var(--mq-dist, 0)); } }
    .eq { display: flex; gap: 2px; align-items: flex-end; height: 11px; flex: none; }
    .eq i { width: 2px; background: var(--accent); animation: eq 1s ease-in-out infinite; }
    .eq i:nth-child(2) { animation-delay: .2s; } .eq i:nth-child(3) { animation-delay: .4s; }
    @keyframes eq { 0%,100% { height: 3px; } 50% { height: 11px; } }
    #player.paused .eq i { animation: none; height: 3px; opacity: .5; }
    .pl-bar { height: 4px; margin-top: 0; border-radius: 4px; overflow: hidden; background: rgba(255, 255, 255, .08); cursor: pointer; position: relative; }
    .pl-bar::before { content: ""; position: absolute; inset: -6px 0; }  /* bigger hit area for seeking */
    .pl-bar:hover { height: 6px; margin-block: -1px; }
    .pl-skip { width: 26px; height: 26px; flex: none; display: grid; place-items: center; padding: 0; cursor: pointer;
               color: var(--muted); background: none; border: 0; border-radius: 50%; }
    .pl-skip:hover, .pl-skip:focus-visible { color: var(--accent); outline: none; }
    .pl-skip svg { width: 13px; height: 13px; fill: currentColor; }
    #player:not(.yt) .pl-skip { display: none; }
    .pl-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--aur2), var(--aur1)); }
    .pl-bar.live i { width: 30%; animation: livebar 2.6s ease-in-out infinite alternate; }
    #player.paused .pl-bar.live i { animation-play-state: paused; }
    @keyframes livebar { from { margin-left: 0; } to { margin-left: 70%; } }
    #vol { width: 64px; flex: none; accent-color: var(--accent); }
    @media (max-width: 480px) { #player { left: 16px; right: 16px; width: auto; } #vol { width: 54px; } }

    /* custom cursor (mouse only) */
    #cdot, #cring { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; border-radius: 50%; display: none; }
    body.fxcursor, body.fxcursor * { cursor: none !important; }
    body.fxcursor #cdot, body.fxcursor #cring { display: block; }
    #cdot { width: 6px; height: 6px; margin: -3px 0 0 -3px; background: #fff; box-shadow: 0 0 8px var(--accent), 0 0 16px var(--aur2); }
    #cring { width: 30px; height: 30px; margin: -15px 0 0 -15px; border: 1px solid rgba(196, 181, 253, .55); transition: width .2s, height .2s, margin .2s, border-color .2s; }
    #cring.hover { width: 46px; height: 46px; margin: -23px 0 0 -23px; border-color: var(--aur1); }

    @media (prefers-reduced-motion: reduce) {
      .stage.in { animation: none; opacity: 1; transform: none; }
      .avatar.spin, .avatar.poke, h1, .eq i, .pl-bar.live i { animation: none; }
      .eq i { height: 6px; }
    }
  </style>
</head>
<body>
  <canvas id="aurora"></canvas>
  <canvas id="bg"></canvas>
  <canvas id="rain"></canvas>
  <canvas id="fx"></canvas>
  <div id="cdot"></div><div id="cring"></div>
  <div id="gate" role="button" tabindex="0" aria-label="Enter"><span class="blink">click to enter</span></div>

  <div class="stage" id="stage">
    <main id="card">
      <div class="av-wrap">
        <img class="avatar" id="avatar" src="avatar.png" alt="Tihvert" title="don't click me" width="96" height="96">
        <span class="sdot" id="sdot" hidden></span>
      </div>
      <div class="name-wrap" id="nameWrap"><h1>Tihvert</h1></div>
      <p class="cstatus" id="cstatus"></p>
      <p class="typed" id="typed"></p>

      <div class="meta">
        <span>📍 Finland</span>
        <span id="clock">--:--</span>
        <span id="wx" hidden></span>
        <span id="views" hidden></span>
        <span class="st" id="statusText" hidden></span>
      </div>

      <section class="presence" id="presence" hidden aria-live="polite">
        <div class="pcard act" id="act" hidden>
          <img class="pimg" id="actImg" alt="" hidden>
          <div class="picon" id="actIcon"><svg viewBox="0 0 24 24"><path d="M7 6h10a5 5 0 0 1 4.9 6l-.9 4.6a2.6 2.6 0 0 1-4.5 1.3L14.3 15H9.7l-2.2 2.9A2.6 2.6 0 0 1 3 16.6L2.1 12A5 5 0 0 1 7 6Zm1 3v1.5H6.5v2H8V14h2v-1.5h1.5v-2H10V9H8Zm7.5 1a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4Zm2.4 2.3a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4Z"/></svg></div>
          <div class="ptxt">
            <div class="pkind" id="actKind">playing</div>
            <div class="pname" id="actName"></div>
            <div class="psub" id="actSub"></div>
            <div class="ptime" id="actTime"></div>
          </div>
        </div>
        <div class="pcard spot" id="spot" hidden>
          <img class="pimg" id="spotArt" alt="">
          <div class="ptxt">
            <div class="pkind">listening on spotify</div>
            <div class="pname" id="spotSong"></div>
            <div class="psub" id="spotArtist"></div>
            <div class="pbar"><i id="spotBar"></i></div>
            <div class="ptimes"><span id="spotCur">0:00</span><span id="spotDur">0:00</span></div>
          </div>
        </div>
        <p class="pidle" id="pidle" hidden></p>
        <div class="pcard week" id="week" hidden>
          <div class="whead"><span class="pkind">this week</span><span class="ptime" id="weekTotal"></span></div>
          <div class="wbars" id="weekBars"></div>
          <div class="wlegend" id="weekLegend"></div>
        </div>
      </section>

      var player = $('player'), pp = $('pp'), title = $('plTitle'), bar = $('plBar'), prog = $('plProg'), vol = $('vol');
      var PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
      var PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';
      var mode = null, playing = false, ytp = null, titleSet = false;
      var ctx, master, step = 0;
      var v = 35;
      try { var sv = parseInt(localStorage.getItem('tihvert-vol'), 10); if (sv >= 0 && sv <= 100) v = sv; } catch (e) {}
      vol.value = v;

      // Song name: when it is wider than its box, show "name · name" and slide by exactly one
      // "name · " so the loop is seamless; speed ~30 px/s.
      var nameBox = $('plName');
      function fitTitle() {
        var text = title.dataset.text || title.textContent;
        nameBox.classList.remove('scroll'); title.textContent = text;
        if (reduce || title.offsetWidth <= nameBox.clientWidth) return;
        var single = title.offsetWidth;
        title.textContent = text + ' · ' + text;
        var unit = title.offsetWidth - single;
        nameBox.style.setProperty('--mq-dist', -unit + 'px');
        nameBox.style.setProperty('--mq-dur', (unit / 30 / 0.85).toFixed(1) + 's');
        nameBox.classList.add('scroll');
      }
      function setTitle(text) { title.dataset.text = text; fitTitle(); }
      addEventListener('resize', function () { if (player.classList.contains('show')) fitTitle(); });
      if (document.fonts) document.fonts.ready.then(function () { if (player.classList.contains('show')) fitTitle(); });

      function ui() {
        pp.innerHTML = playing ? PAUSE : PLAY;
        pp.setAttribute('aria-label', playing ? 'Pause music' : 'Play music');
        player.classList.toggle('paused', !playing);
      }
      function remember() { try { localStorage.setItem('tihvert-muted', playing ? '0' : '1'); } catch (e) {} }
      function wasMuted() { try { return localStorage.getItem('tihvert-muted') === '1'; } catch (e) { return false; } }

      // ---- original ambient loop, synthesized live (no audio file, no licensing) ----
      // Am7 - Fmaj7 - Cmaj7 - G6, slow and dreamy
      var chords = [[57, 60, 64, 67], [53, 57, 60, 64], [48, 55, 59, 64], [55, 59, 62, 64]];
      var BEAT = 0.42; // seconds per 8th note
      function hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
      function pad(notes, t, dur) {
        notes.forEach(function (n) {
          [0, 7].forEach(function (det) {
            var o = ctx.createOscillator(), g = ctx.createGain();
            o.type = 'triangle'; o.frequency.value = hz(n - 12); o.detune.value = det;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.022, t + 1.2);
            g.gain.linearRampToValueAtTime(0, t + dur);
            o.connect(g); g.connect(master.lp); o.start(t); o.stop(t + dur + 0.1);
          });
        });
      }
      function pluck(n, t) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = hz(n + 12);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.05, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
        o.connect(g); g.connect(master.delay); g.connect(master.lp); o.start(t); o.stop(t + 1.2);
      }
      function crackle() {
        var len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = Math.random() < 0.0008 ? (Math.random() * 2 - 1) * 0.5 : (Math.random() * 2 - 1) * 0.004;
        var s = ctx.createBufferSource(), g = ctx.createGain();
        s.buffer = buf; s.loop = true; g.gain.value = 0.35; s.connect(g); g.connect(master.lp); s.start();
      }
      function schedule() {
        var now = ctx.currentTime;
        while (master.next < now + 0.6) {
          var bar8 = Math.floor(step / 8) % chords.length, ch = chords[bar8], pos = step % 8;
          if (pos === 0) pad(ch, master.next, BEAT * 8 + 0.3);
          var pattern = [0, 2, 1, 3, 2, 1, 3, 2];
          if (pos !== 5 || Math.random() < 0.5) pluck(ch[pattern[pos]], master.next);
          master.next += BEAT; step++;
        }
      }
      function build() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain(); master.gain.value = 0;
        var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800; lp.Q.value = 0.4;
        var delay = ctx.createDelay(); delay.delayTime.value = BEAT * 3;
        var fb = ctx.createGain(); fb.gain.value = 0.35;
        delay.connect(fb); fb.connect(delay); delay.connect(lp);
        lp.connect(master); master.connect(ctx.destination);
        master.lp = lp; master.delay = delay; master.next = ctx.currentTime + 0.1;
        crackle();
      }
      function synthGain() { return playing ? v / 100 * 2.5 : 0; }
      function fade() { master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(synthGain(), ctx.currentTime, 0.6); }

      function play() {
        playing = true;
        if (mode === 'yt') { ytp.unMute(); ytp.setVolume(v); ytp.playVideo(); }
        else if (mode === 'synth') { if (ctx.state === 'suspended') ctx.resume(); fade(); }
        ui(); remember();
      }
      function pause() {
        playing = false;
        if (mode === 'yt') ytp.pauseVideo();
        else if (mode === 'synth') fade();
        ui(); remember();
      }
      pp.addEventListener('click', function () { if (mode) playing ? pause() : play(); });
      // Spotify-style controls (YouTube songs only): skip back / forward, click or drag the bar to seek
      $('nextBtn').addEventListener('click', function () { if (mode === 'yt' && ytp) { nextTrack(); if (!playing) play(); } });
      $('prevBtn').addEventListener('click', function () {
        if (mode !== 'yt' || !ytp) return;
        if (ytp.getCurrentTime() > 3) ytp.seekTo(0, true);  // like Spotify: first press restarts the song
        else { track = (track - 2 + MUSIC_PLAYLIST.length) % MUSIC_PLAYLIST.length; nextTrack(); }
        if (!playing) play();
      });
      function seekTo(e) {
        if (mode !== 'yt' || !ytp || !ytp.getDuration) return;
        var r = bar.getBoundingClientRect(), f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        ytp.seekTo(f * ytp.getDuration(), true); prog.style.width = f * 100 + '%';
      }
      var dragging = false;
      bar.addEventListener('pointerdown', function (e) { dragging = true; bar.setPointerCapture(e.pointerId); seekTo(e); });
      bar.addEventListener('pointermove', function (e) { if (dragging) seekTo(e); });
      bar.addEventListener('pointerup', function () { dragging = false; });
      vol.addEventListener('input', function () {
        v = +vol.value;
        try { localStorage.setItem('tihvert-vol', String(v)); } catch (e) {}
        if (mode === 'yt' && ytp) ytp.setVolume(v);
        else if (mode === 'synth') fade();
      });

      // YouTube song mode: progress bar + real title
      setInterval(function () {
        if (mode !== 'yt' || !ytp || !ytp.getDuration) return;
        var d = ytp.getDuration(), c = ytp.getCurrentTime();
        prog.style.width = (d ? c / d * 100 : 0) + '%';
        if (!titleSet && !MUSIC_TITLE && ytp.getVideoData) {
          var vd = ytp.getVideoData();
          if (vd && vd.title) { setTitle(vd.title); titleSet = true; }
        }
      }, 500);
      // The YouTube player is preloaded while the gate is still showing, and "primed": it starts
      // muted (browsers allow muted autoplay), and the moment audio is flowing it is paused back at
      // 0:00. The opening seconds are then already buffered, so "enter" starts the song instantly.
      var entered = false, ytReady = false, ytFailed = false, priming = false, track = 0;
      function showTrack(t) {
        setTitle(t.title || 'loading…');
        var art = $('plArt'); if (t.cover) { art.src = t.cover; art.hidden = false; } else art.hidden = true;
      }
      function nextTrack() {
        track = (track + 1) % MUSIC_PLAYLIST.length;
        showTrack(MUSIC_PLAYLIST[track]); ytp.loadVideoById(MUSIC_PLAYLIST[track].id);
      }
      function beginYouTube() {
        mode = 'yt'; player.classList.add('yt');
        bar.classList.remove('live'); player.classList.add('show');
        showTrack(MUSIC_PLAYLIST[0]);
        if (priming) { priming = false; ytp.seekTo(0, true); }  // clicked mid-prime: restart from the top
        wasMuted() ? pause() : play();
      }
      function preloadYouTube(id) {
        var holder = document.createElement('div'); holder.id = 'ytplayer';
        holder.style.cssText = 'position:fixed;width:1px;height:1px;left:-9999px;top:0;';
        document.body.appendChild(holder);
        window.onYouTubeIframeAPIReady = function () {
          new YT.Player('ytplayer', {
            videoId: id, width: 1, height: 1,
            playerVars: { autoplay: 0, controls: 0, playsinline: 1 },
            events: {
              onReady: function (e) {
                ytp = e.target; ytReady = true;
                if (entered && !mode) beginYouTube();
                else if (!entered) { priming = true; ytp.mute(); ytp.playVideo(); }
              },
              onStateChange: function (e) {
                if (priming && e.data === YT.PlayerState.PLAYING) { priming = false; ytp.pauseVideo(); ytp.seekTo(0, true); }
                else if (mode === 'yt' && e.data === YT.PlayerState.ENDED) nextTrack();  // song over: next one, then loop
              },
              // a later song unavailable: skip it; the first one blocked: fall back to the built-in ambient loop
              onError: function () {
                if (mode === 'yt' && track > 0) { nextTrack(); return; }
                ytFailed = true; if (entered && mode !== 'synth') { mode = null; startSynth(); }
              }
            }
          });
        };
        var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
      }

      function startSynth() {
        try {
          build(); mode = 'synth';
          bar.classList.add('live'); player.classList.add('show');
          setTitle('ambient loop · original');
          setInterval(schedule, 150); schedule();
          wasMuted() ? pause() : play();
        } catch (e) { /* no Web Audio: page still works silently */ }
      }

      ui();
      if (MUSIC_YOUTUBE_ID) preloadYouTube(MUSIC_YOUTUBE_ID);
      return {
        // called from the "click to enter" handler, i.e. inside the user gesture that allows sound
        start: function () {
          if (entered) return;
          entered = true;
          if (!MUSIC_YOUTUBE_ID || ytFailed) startSynth();
          else if (ytReady) beginYouTube();
          // otherwise onReady starts it as soon as the player has finished loading
        }
      };
    })();
  </script>
</body>
