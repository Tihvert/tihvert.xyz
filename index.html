<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tihvert</title>
  <meta name="description" content="Tihvert. Writes code, breaks code, occasionally fixes it.">
  <meta name="theme-color" content="#09090b">
  <link rel="icon" id="favicon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card: rgba(18, 18, 22, 0.72);
      --line: rgba(255, 255, 255, 0.08);
      --text: #e4e4e7;
      --muted: #8b8b94;
      --accent: #c4b5fd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
      display: grid; place-items: center;
      padding: 24px 16px;
      overflow: hidden;
    }
    canvas#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    /* click-to-enter gate */
    #gate {
      position: fixed; inset: 0; z-index: 5;
      display: grid; place-items: center;
      background: var(--bg);
      cursor: pointer;
      transition: opacity .6s ease;
      color: var(--muted); font-size: 14px; letter-spacing: .08em;
    }
    #gate.gone { opacity: 0; pointer-events: none; }
    .blink::after { content: "_"; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    main {
      position: relative; z-index: 1;
      width: 100%; max-width: 380px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px 24px 22px;
      backdrop-filter: blur(10px);
      text-align: center;
      opacity: 0; transform: translateY(24px);
    }
    main.in { animation: slideup .7s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes slideup { to { opacity: 1; transform: none; } }

    .avatar {
      width: 96px; height: 96px; margin: 0 auto 16px;
      border-radius: 50%;
      border: 2px solid var(--line);
      box-shadow: 0 0 0 4px rgba(196, 181, 253, .10), 0 8px 30px rgba(0,0,0,.5);
      cursor: pointer; user-select: none; display: block;
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .avatar:hover { transform: rotate(-8deg) scale(1.04); box-shadow: 0 0 0 4px rgba(196, 181, 253, .25), 0 8px 30px rgba(0,0,0,.5); }
    .avatar.spin { animation: spin .8s ease; }
    @keyframes spin { to { transform: rotate(720deg); } }

    h1 { font-size: 24px; font-weight: 800; letter-spacing: .02em; }
    .typed { margin-top: 8px; min-height: 1.5em; color: var(--muted); font-size: 13px; }
    .typed::after { content: "▍"; color: var(--accent); margin-left: 1px; animation: blink 1s steps(1) infinite; }

    .meta { margin-top: 14px; font-size: 12px; color: var(--muted); display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }

    .icons { display: flex; justify-content: center; gap: 12px; margin-top: 22px; }
    .icons a {
      width: 44px; height: 44px; display: grid; place-items: center;
      border-radius: 12px; border: 1px solid var(--line);
      color: var(--text); background: rgba(255,255,255,.02);
      transition: transform .15s, border-color .15s, color .15s;
    }
    .icons a:hover, .icons a:focus-visible { transform: translateY(-3px); border-color: var(--accent); color: var(--accent); outline: none; }
    .icons svg { width: 20px; height: 20px; fill: currentColor; }
    .icons a[hidden] { display: none; }

    .egg { margin-top: 18px; font-size: 11px; color: #52525b; min-height: 1.4em; }

    /* sound toggle */
    #sound {
      position: fixed; right: 16px; bottom: 16px; z-index: 4;
      display: none; align-items: center; gap: 8px;
      font: 12px "JetBrains Mono", monospace; color: var(--muted);
      background: var(--card); border: 1px solid var(--line); border-radius: 999px;
      padding: 8px 12px; cursor: pointer; backdrop-filter: blur(10px);
    }
    #sound.show { display: flex; }
    #sound:hover { color: var(--text); border-color: var(--accent); }
    .bars { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
    .bars i { width: 2px; background: var(--accent); animation: eq 1s ease-in-out infinite; }
    .bars i:nth-child(2) { animation-delay: .2s; } .bars i:nth-child(3) { animation-delay: .4s; }
    @keyframes eq { 0%,100% { height: 3px; } 50% { height: 12px; } }
    #sound.muted .bars i { animation: none; height: 3px; opacity: .5; }

    @media (prefers-reduced-motion: reduce) {
      main.in { animation: none; opacity: 1; transform: none; }
      .avatar.spin { animation: none; }
      .bars i { animation: none; height: 6px; }
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div id="gate" role="button" tabindex="0" aria-label="Enter"><span class="blink">click to enter</span></div>

  <main id="card">
    <img class="avatar" id="avatar" src="avatar.png" alt="Tihvert" title="don't click me" width="96" height="96">
    <h1>Tihvert</h1>
    <p class="typed" id="typed"></p>

    <div class="meta">
      <span>📍 Finland</span>
      <span id="clock">--:--</span>
    </div>

    <nav class="icons">
      <a href="https://discord.com/users/1015157576687698030" target="_blank" rel="noopener" aria-label="Discord" title="Discord">
        <svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.3 18.3 0 0 0-5.5 0L8.6 3a19.7 19.7 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1a19.9 19.9 0 0 0 6 3l1.3-2a12.8 12.8 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4a12.9 12.9 0 0 1-2 1l1.3 2a19.8 19.8 0 0 0 6-3c.5-5.2-.9-9.7-3.6-13.7ZM8 15.4c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.6 8 10.6s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>
      </a>
      <a href="https://github.com/Tihvert" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
        <svg viewBox="0 0 24 24"><path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.6 18.3 5 18.3 5c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5Z"/></svg>
      </a>
      <a id="yt" href="#" target="_blank" rel="noopener" aria-label="YouTube" title="YouTube" hidden>
        <svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg>
      </a>
    </nav>

    <p class="egg" id="egg"></p>
  </main>

  <button id="sound" type="button" aria-label="Toggle music"><span class="bars"><i></i><i></i><i></i></span><span id="soundLabel">music on</span></button>

  <script>
    // Set your channel here, e.g. "https://www.youtube.com/@yourhandle". Empty = icon hidden.
    var YOUTUBE_URL = "";
    // Background song from YouTube (official embed player, plays after "click to enter").
    // Paste the video id, e.g. "dQw4w9WgXcQ". Empty = the built-in ambient loop plays instead.
    var MUSIC_YOUTUBE_ID = "";
    if (YOUTUBE_URL) { var yt = document.getElementById('yt'); yt.href = YOUTUBE_URL; yt.hidden = false; }

    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---------- gate ---------- */
    var gate = document.getElementById('gate'), card = document.getElementById('card');
    function enter() {
      if (gate.classList.contains('gone')) return;
      gate.classList.add('gone'); card.classList.add('in'); startTyping(); Music.start();
    }
    gate.addEventListener('click', enter);
    gate.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') enter(); });

    /* ---------- typewriter bio ---------- */
    var lines = ['writes code.', 'breaks code.', 'fixes the code that broke.', 'debugging at 3am.', 'probably asleep.', 'touching grass (rarely).'];
    var el = document.getElementById('typed'), li = 0, ci = 0, del = false, started = false;
    function startTyping() { if (started) return; started = true; if (reduce) { el.textContent = lines[0]; return; } tick(); }
    function tick() {
      var s = lines[li];
      el.textContent = s.slice(0, ci);
      if (!del && ci < s.length) { ci++; setTimeout(tick, 70); }
      else if (!del) { del = true; setTimeout(tick, 1600); }
      else if (ci > 0) { ci--; setTimeout(tick, 35); }
      else { del = false; li = (li + 1) % lines.length; setTimeout(tick, 300); }
    }

    /* ---------- Helsinki clock ---------- */
    var clock = document.getElementById('clock');
    function t() { clock.textContent = '🕒 ' + new Date().toLocaleTimeString('en-GB', { timeZone: 'Europe/Helsinki', hour: '2-digit', minute: '2-digit' }); }
    t(); setInterval(t, 10000);

    /* ---------- avatar easter egg ---------- */
    var clicks = 0, egg = document.getElementById('egg'), av = document.getElementById('avatar');
    var msgs = ['', 'hey.', 'stop that.', 'seriously.', 'ok fine.', 'wheee'];
    av.addEventListener('click', function () {
      clicks++;
      egg.textContent = msgs[Math.min(clicks, msgs.length - 1)];
      if (clicks >= 5) { av.classList.remove('spin'); void av.offsetWidth; av.classList.add('spin'); clicks = 0; setTimeout(function () { egg.textContent = ''; }, 1500); }
    });

    /* ---------- animated tab: typing title + pulsing avatar favicon ---------- */
    (function () {
      var name = 'Tihvert', i = 0, back = false;
      function title() {
        document.title = (name.slice(0, i) || '​') + (i < name.length ? '_' : '');
        if (!back) { if (i < name.length) i++; else { back = true; setTimeout(title, 2500); return; } }
        else { if (i > 1) i--; else back = false; }
        setTimeout(title, back ? 90 : 180);
      }
      if (!reduce) title();

      var link = document.getElementById('favicon'), img = new Image(), fc = document.createElement('canvas');
      fc.width = fc.height = 64; var fx = fc.getContext('2d'), ph = 0;
      img.onload = function () {
        if (reduce) return;
        setInterval(function () {
          ph += 0.25;
          fx.clearRect(0, 0, 64, 64);
          fx.save(); fx.beginPath(); fx.arc(32, 32, 26, 0, 6.3); fx.clip();
          fx.drawImage(img, 6, 6, 52, 52); fx.restore();
          fx.beginPath(); fx.arc(32, 32, 29, 0, 6.3);
          fx.lineWidth = 4; fx.strokeStyle = 'rgba(196,181,253,' + (0.35 + 0.35 * Math.sin(ph)) + ')'; fx.stroke();
          link.href = fc.toDataURL('image/png');
        }, 200);
      };
      img.src = 'favicon.png';
    })();

    /* ---------- drifting particles ---------- */
    var c = document.getElementById('bg'), x = c.getContext('2d'), P = [], W, H;
    function size() { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; }
    size(); addEventListener('resize', size);
    for (var k = 0; k < 60; k++) P.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + .4, v: Math.random() * .0006 + .0002, o: Math.random() * .5 + .15 });
    function draw() {
      x.clearRect(0, 0, W, H);
      P.forEach(function (p) {
        p.y += p.v; if (p.y > 1) { p.y = 0; p.x = Math.random(); }
        x.beginPath(); x.arc(p.x * W, p.y * H, p.r * devicePixelRatio, 0, 6.3);
        x.fillStyle = 'rgba(196,181,253,' + p.o + ')'; x.fill();
      });
      if (!reduce) requestAnimationFrame(draw);
    }
    draw();

    /* ---------- music: original ambient loop, synthesized live (no audio file, no licensing) ---------- */
    var Music = (function () {
      var ctx, master, playing = false, timer, step = 0;
      var btn = document.getElementById('sound'), label = document.getElementById('soundLabel');
      // Am7 - Fmaj7 - Cmaj7 - G6, slow and dreamy
      var chords = [[57, 60, 64, 67], [53, 57, 60, 64], [48, 55, 59, 64], [55, 59, 62, 64]];
      var BEAT = 0.42; // seconds per 8th note
      function hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }

      function pad(notes, t, dur) {
        notes.forEach(function (n) {
          [0, 7].forEach(function (det) {
            var o = ctx.createOscillator(), g = ctx.createGain();
            o.type = 'triangle'; o.frequency.value = hz(n - 12); o.detune.value = det;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.022, t + 1.2);
            g.gain.linearRampToValueAtTime(0, t + dur);
            o.connect(g); g.connect(master.lp); o.start(t); o.stop(t + dur + 0.1);
          });
        });
      }
      function pluck(n, t) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = hz(n + 12);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.05, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
        o.connect(g); g.connect(master.delay); g.connect(master.lp); o.start(t); o.stop(t + 1.2);
      }
      function crackle() {
        var len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = Math.random() < 0.0008 ? (Math.random() * 2 - 1) * 0.5 : (Math.random() * 2 - 1) * 0.004;
        var s = ctx.createBufferSource(), g = ctx.createGain();
        s.buffer = buf; s.loop = true; g.gain.value = 0.35; s.connect(g); g.connect(master.lp); s.start();
      }
      function schedule() {
        var now = ctx.currentTime;
        while (master.next < now + 0.6) {
          var bar = Math.floor(step / 8) % chords.length, ch = chords[bar], pos = step % 8;
          if (pos === 0) pad(ch, master.next, BEAT * 8 + 0.3);
          var pattern = [0, 2, 1, 3, 2, 1, 3, 2];
          if (pos !== 5 || Math.random() < 0.5) pluck(ch[pattern[pos]], master.next);
          master.next += BEAT; step++;
        }
      }
      function build() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain(); master.gain.value = 0;
        var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800; lp.Q.value = 0.4;
        var delay = ctx.createDelay(); delay.delayTime.value = BEAT * 3;
        var fb = ctx.createGain(); fb.gain.value = 0.35;
        delay.connect(fb); fb.connect(delay); delay.connect(lp);
        lp.connect(master); master.connect(ctx.destination);
        master.lp = lp; master.delay = delay; master.next = ctx.currentTime + 0.1;
        crackle();
      }
      function fade(to) { master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(to, ctx.currentTime, 0.6); }
      function on() { playing = true; fade(0.9); btn.classList.remove('muted'); label.textContent = 'music on'; try { localStorage.setItem('tihvert-muted', '0'); } catch (e) {} }
      function off() { playing = false; fade(0); btn.classList.add('muted'); label.textContent = 'music off'; try { localStorage.setItem('tihvert-muted', '1'); } catch (e) {} }
      btn.addEventListener('click', function () {
        if (yt) { playing ? ytOff() : ytOn(); return; }
        if (!ctx) return; playing ? off() : on();
      });

      // YouTube song mode
      var yt = null;
      function ytOn() { playing = true; yt.unMute(); yt.setVolume(35); yt.playVideo(); btn.classList.remove('muted'); label.textContent = 'music on'; try { localStorage.setItem('tihvert-muted', '0'); } catch (e) {} }
      function ytOff() { playing = false; yt.pauseVideo(); btn.classList.add('muted'); label.textContent = 'music off'; try { localStorage.setItem('tihvert-muted', '1'); } catch (e) {} }
      function startYouTube(id) {
        var holder = document.createElement('div'); holder.id = 'ytplayer';
        holder.style.cssText = 'position:fixed;width:1px;height:1px;left:-9999px;top:0;';
        document.body.appendChild(holder);
        window.onYouTubeIframeAPIReady = function () {
          new YT.Player('ytplayer', {
            videoId: id, width: 1, height: 1,
            playerVars: { autoplay: 1, loop: 1, playlist: id, controls: 0, playsinline: 1 },
            events: { onReady: function (e) {
              yt = e.target; btn.classList.add('show');
              var muted = false; try { muted = localStorage.getItem('tihvert-muted') === '1'; } catch (err) {}
              muted ? ytOff() : ytOn();
            } }
          });
        };
        var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
      }

      return {
        start: function () {
          if (MUSIC_YOUTUBE_ID) { startYouTube(MUSIC_YOUTUBE_ID); return; }
          try {
            build(); btn.classList.add('show');
            timer = setInterval(schedule, 150); schedule();
            var muted = false; try { muted = localStorage.getItem('tihvert-muted') === '1'; } catch (e) {}
            muted ? off() : on();
          } catch (e) { /* no Web Audio: page still works silently */ }
        }
      };
    })();
  </script>
</body>
</html>
