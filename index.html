<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tihvert</title>
  <meta name="description" content="Tihvert. Writes code, breaks code, occasionally fixes it.">
  <meta name="theme-color" content="#050507">
  <link rel="icon" id="favicon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050507;
      --card: rgba(10, 10, 14, 0.72);
      --line: rgba(255, 255, 255, 0.09);
      --text: #e4e4e7;
      --muted: #8b8b98;
      --faint: #5a5a66;
      --accent: #c4b5fd;
      --aur1: #6ee7b7;
      --aur2: #a78bfa;
      --aur3: #7dd3fc;
      --online: #22c55e;
      --idle: #f5b33b;
      --dnd: #ef4444;
      --offline: #6b6b76;
      --spotify: #1ed760;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html { height: 100%; }
    body {
      min-height: 100%;
      background: radial-gradient(120% 80% at 50% 0%, #090a10 0%, var(--bg) 60%) var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
      display: grid; place-items: center; grid-template-columns: minmax(0, 1fr);
      padding: 24px 16px 104px;
      overflow-x: hidden;
    }
    #aurora, #bg, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #aurora { z-index: 0; filter: blur(18px); opacity: .3; }
    #bg { z-index: 0; }
    #fx { z-index: 55; }

    /* click-to-enter gate */
    #gate {
      position: fixed; inset: 0; z-index: 5;
      display: grid; place-items: center;
      background: rgba(5, 5, 7, .8);
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: opacity .7s ease;
      color: var(--muted); font-size: 14px; letter-spacing: .08em;
    }
    #gate.gone { opacity: 0; pointer-events: none; }
    .blink::after { content: "_"; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .stage { position: relative; z-index: 1; width: 100%; max-width: 400px; min-width: 0; opacity: 0; transform: translateY(24px); }
    .stage.in { animation: slideup .8s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes slideup { to { opacity: 1; transform: none; } }

    main {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 30px 22px 20px;
      backdrop-filter: blur(14px);
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45), 0 0 50px rgba(167, 139, 250, .07);
      will-change: transform;
    }
    main::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: radial-gradient(420px circle at var(--gx, 50%) var(--gy, -10%), rgba(255, 255, 255, .08), transparent 45%);
    }

    /* avatar + live status dot */
    .av-wrap { position: relative; width: 96px; height: 96px; margin: 0 auto 14px; }
    .avatar {
      width: 96px; height: 96px;
      border-radius: 50%;
      border: 2px solid var(--line);
      box-shadow: 0 0 0 4px rgba(196, 181, 253, .10), 0 8px 30px rgba(0,0,0,.5);
      cursor: pointer; user-select: none; display: block; object-fit: cover;
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .avatar:hover { transform: rotate(-8deg) scale(1.04); box-shadow: 0 0 0 4px rgba(196, 181, 253, .25), 0 8px 30px rgba(0,0,0,.5); }
    .avatar.spin { animation: spin .8s ease; }
    @keyframes spin { to { transform: rotate(720deg); } }
    .sdot {
      position: absolute; right: 2px; bottom: 4px;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--offline); border: 4px solid #0a0a0e;
      transition: background .3s, box-shadow .3s;
    }
    .sdot.online { background: var(--online); box-shadow: 0 0 12px rgba(34, 197, 94, .55); }
    .sdot.idle { background: var(--idle); box-shadow: 0 0 12px rgba(245, 179, 59, .45); }
    .sdot.dnd { background: var(--dnd); box-shadow: 0 0 12px rgba(239, 68, 68, .45); }

    /* glowing name with sparkles */
    .name-wrap { position: relative; display: inline-block; padding: 0 6px; }
    h1 {
      font-size: 27px; font-weight: 800; letter-spacing: .03em;
      background: linear-gradient(90deg, var(--accent), var(--aur1), var(--aur3), var(--aur2), var(--accent));
      background-size: 300% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 10px rgba(167, 139, 250, .55));
      animation: sheen 7s linear infinite;
    }
    @keyframes sheen { to { background-position: 300% 0; } }
    .sparkle {
      position: absolute; pointer-events: none; color: #fff; font-size: 10px; line-height: 1;
      text-shadow: 0 0 6px var(--accent), 0 0 12px var(--aur2);
      animation: sparkle 1.1s ease-out forwards;
    }
    @keyframes sparkle {
      0% { opacity: 0; transform: scale(0) rotate(0deg); }
      30% { opacity: 1; transform: scale(1) rotate(60deg); }
      100% { opacity: 0; transform: translateY(-8px) scale(.4) rotate(140deg); }
    }

    .cstatus { margin-top: 6px; font-size: 12px; color: var(--text); opacity: .85; display: flex; gap: 6px; justify-content: center; align-items: center; min-height: 1.4em; }
    .cstatus img { width: 16px; height: 16px; }
    .typed { margin-top: 6px; min-height: 1.5em; color: var(--muted); font-size: 13px; }
    .typed::after { content: "▍"; color: var(--accent); margin-left: 1px; animation: blink 1s steps(1) infinite; }

    .meta { margin-top: 12px; font-size: 12px; color: var(--muted); display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
    .st::first-letter { color: var(--offline); }
    .st.online::first-letter { color: var(--online); }
    .st.idle::first-letter { color: var(--idle); }
    .st.dnd::first-letter { color: var(--dnd); }

    /* live Discord presence */
    .presence { margin-top: 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; text-align: left; }
    .pcard {
      display: flex; gap: 12px; align-items: center;
      padding: 10px; border: 1px solid var(--line); border-radius: 14px;
      background: rgba(255, 255, 255, .025);
    }
    .pimg, .picon { width: 52px; height: 52px; border-radius: 10px; flex: none; }
    .pimg { object-fit: cover; background: rgba(255, 255, 255, .04); }
    .picon { display: grid; place-items: center; background: rgba(196, 181, 253, .08); color: var(--accent); }
    .picon svg { width: 24px; height: 24px; fill: currentColor; }
    .ptxt { min-width: 0; flex: 1; }
    .pkind { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .pname, .psub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pname { font-size: 13px; font-weight: 600; margin-top: 2px; }
    .psub { font-size: 11px; color: var(--muted); }
    .ptime { font-size: 10px; color: var(--accent); margin-top: 3px; font-variant-numeric: tabular-nums; }
    .spot .pkind { color: var(--spotify); }
    .pbar { height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .08); margin-top: 6px; overflow: hidden; }
    .pbar i { display: block; height: 100%; width: 0; background: var(--spotify); transition: width 1s linear; }
    .ptimes { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
    .pidle { font-size: 11px; color: var(--faint); text-align: center; padding: 4px 0; }

    .icons { display: flex; justify-content: center; gap: 12px; margin-top: 20px; }
    .icons a {
      width: 44px; height: 44px; display: grid; place-items: center;
      border-radius: 12px; border: 1px solid var(--line);
      color: var(--text); background: rgba(255,255,255,.02);
      transition: transform .15s, border-color .15s, color .15s, box-shadow .15s;
    }
    .icons a:hover, .icons a:focus-visible { transform: translateY(-3px); border-color: var(--accent); color: var(--accent); box-shadow: 0 6px 20px rgba(167, 139, 250, .18); outline: none; }
    .icons svg { width: 20px; height: 20px; fill: currentColor; }

    .egg { margin-top: 16px; font-size: 11px; color: var(--faint); min-height: 1.4em; }

    /* music player */
    #player {
      position: fixed; right: 16px; bottom: 16px; z-index: 4;
      width: 310px; max-width: calc(100% - 32px);
      display: none; align-items: center; gap: 10px;
      padding: 10px 12px;
      font-size: 11px; color: var(--muted);
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      backdrop-filter: blur(14px);
    }
    #player.show { display: flex; }
    #pp {
      width: 34px; height: 34px; flex: none; border-radius: 50%;
      display: grid; place-items: center; cursor: pointer;
      color: var(--text); background: rgba(255, 255, 255, .04); border: 1px solid var(--line);
    }
    #pp:hover, #pp:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }
    #pp svg { width: 14px; height: 14px; fill: currentColor; }
    .pl-info { flex: 1; min-width: 0; }
    .pl-title { display: flex; align-items: center; gap: 8px; color: var(--text); }
    .pl-title span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .eq { display: flex; gap: 2px; align-items: flex-end; height: 11px; flex: none; }
    .eq i { width: 2px; background: var(--accent); animation: eq 1s ease-in-out infinite; }
    .eq i:nth-child(2) { animation-delay: .2s; } .eq i:nth-child(3) { animation-delay: .4s; }
    @keyframes eq { 0%,100% { height: 3px; } 50% { height: 11px; } }
    #player.paused .eq i { animation: none; height: 3px; opacity: .5; }
    .pl-bar { height: 3px; margin-top: 6px; border-radius: 3px; overflow: hidden; background: rgba(255, 255, 255, .08); }
    .pl-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--aur2), var(--aur1)); }
    .pl-bar.live i { width: 30%; animation: livebar 2.6s ease-in-out infinite alternate; }
    #player.paused .pl-bar.live i { animation-play-state: paused; }
    @keyframes livebar { from { margin-left: 0; } to { margin-left: 70%; } }
    #vol { width: 64px; flex: none; accent-color: var(--accent); }
    @media (max-width: 480px) { #player { left: 16px; right: 16px; width: auto; } #vol { width: 54px; } }

    /* custom cursor (mouse only) */
    #cdot, #cring { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; border-radius: 50%; display: none; }
    body.fxcursor, body.fxcursor * { cursor: none !important; }
    body.fxcursor #cdot, body.fxcursor #cring { display: block; }
    #cdot { width: 6px; height: 6px; margin: -3px 0 0 -3px; background: #fff; box-shadow: 0 0 8px var(--accent), 0 0 16px var(--aur2); }
    #cring { width: 30px; height: 30px; margin: -15px 0 0 -15px; border: 1px solid rgba(196, 181, 253, .55); transition: width .2s, height .2s, margin .2s, border-color .2s; }
    #cring.hover { width: 46px; height: 46px; margin: -23px 0 0 -23px; border-color: var(--aur1); }

    @media (prefers-reduced-motion: reduce) {
      .stage.in { animation: none; opacity: 1; transform: none; }
      .avatar.spin, h1, .eq i, .pl-bar.live i { animation: none; }
      .eq i { height: 6px; }
    }
  </style>
</head>
<body>
  <canvas id="aurora"></canvas>
  <canvas id="bg"></canvas>
  <canvas id="fx"></canvas>
  <div id="cdot"></div><div id="cring"></div>
  <div id="gate" role="button" tabindex="0" aria-label="Enter"><span class="blink">click to enter</span></div>

  <div class="stage" id="stage">
    <main id="card">
      <div class="av-wrap">
        <img class="avatar" id="avatar" src="avatar.png" alt="Tihvert" title="don't click me" width="96" height="96">
        <span class="sdot" id="sdot" hidden></span>
      </div>
      <div class="name-wrap" id="nameWrap"><h1>Tihvert</h1></div>
      <p class="cstatus" id="cstatus"></p>
      <p class="typed" id="typed"></p>

      <div class="meta">
        <span>📍 Finland</span>
        <span id="clock">--:--</span>
        <span class="st" id="statusText" hidden></span>
      </div>

      <section class="presence" id="presence" hidden aria-live="polite">
        <div class="pcard act" id="act" hidden>
          <img class="pimg" id="actImg" alt="" hidden>
          <div class="picon" id="actIcon"><svg viewBox="0 0 24 24"><path d="M7 6h10a5 5 0 0 1 4.9 6l-.9 4.6a2.6 2.6 0 0 1-4.5 1.3L14.3 15H9.7l-2.2 2.9A2.6 2.6 0 0 1 3 16.6L2.1 12A5 5 0 0 1 7 6Zm1 3v1.5H6.5v2H8V14h2v-1.5h1.5v-2H10V9H8Zm7.5 1a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4Zm2.4 2.3a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4Z"/></svg></div>
          <div class="ptxt">
            <div class="pkind" id="actKind">playing</div>
            <div class="pname" id="actName"></div>
            <div class="psub" id="actSub"></div>
            <div class="ptime" id="actTime"></div>
          </div>
        </div>
        <div class="pcard spot" id="spot" hidden>
          <img class="pimg" id="spotArt" alt="">
          <div class="ptxt">
            <div class="pkind">listening on spotify</div>
            <div class="pname" id="spotSong"></div>
            <div class="psub" id="spotArtist"></div>
            <div class="pbar"><i id="spotBar"></i></div>
            <div class="ptimes"><span id="spotCur">0:00</span><span id="spotDur">0:00</span></div>
          </div>
        </div>
        <p class="pidle" id="pidle" hidden></p>
      </section>

      <nav class="icons">
        <a href="https://discord.com/users/1015157576687698030" target="_blank" rel="noopener" aria-label="Discord" title="Discord">
          <svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.3 18.3 0 0 0-5.5 0L8.6 3a19.7 19.7 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1a19.9 19.9 0 0 0 6 3l1.3-2a12.8 12.8 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4a12.9 12.9 0 0 1-2 1l1.3 2a19.8 19.8 0 0 0 6-3c.5-5.2-.9-9.7-3.6-13.7ZM8 15.4c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.6 8 10.6s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>
        </a>
        <a href="https://github.com/Tihvert" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
          <svg viewBox="0 0 24 24"><path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.6 18.3 5 18.3 5c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5Z"/></svg>
        </a>
        <a id="ytLink" href="#" target="_blank" rel="noopener" aria-label="YouTube" title="YouTube" hidden>
          <svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg>
        </a>
      </nav>

      <p class="egg" id="egg"></p>
    </main>
  </div>

  <div id="player" class="paused" role="region" aria-label="Music player">
    <button id="pp" type="button" aria-label="Play music"></button>
    <div class="pl-info">
      <div class="pl-title"><span class="eq"><i></i><i></i><i></i></span><span id="plTitle">…</span></div>
      <div class="pl-bar" id="plBar"><i id="plProg"></i></div>
    </div>
    <input id="vol" type="range" min="0" max="100" value="35" aria-label="Volume">
  </div>

  <script>
    // Set your channel here, e.g. "https://www.youtube.com/@yourhandle". Empty = icon hidden.
    var YOUTUBE_URL = "";
    // Background song from YouTube (official embed player, plays after "click to enter").
    // Paste the video id, e.g. "dQw4w9WgXcQ". Empty = the built-in ambient loop plays instead.
    var MUSIC_YOUTUBE_ID = "";
    // Optional song name shown in the player; empty = the YouTube video title.
    var MUSIC_TITLE = "";
    // Discord account whose live status is shown (needs to be in the Lanyard Discord server).
    var DISCORD_ID = "1015157576687698030";

    function $(id) { return document.getElementById(id); }
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var finePointer = window.matchMedia('(pointer: fine)').matches;
    if (YOUTUBE_URL) { $('ytLink').href = YOUTUBE_URL; $('ytLink').hidden = false; }

    /* ---------- gate ---------- */
    var gate = $('gate'), stage = $('stage'), card = $('card');
    function enter() {
      if (gate.classList.contains('gone')) return;
      gate.classList.add('gone'); stage.classList.add('in'); startTyping(); Music.start();
    }
    gate.addEventListener('click', enter);
    gate.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') enter(); });

    /* ---------- typewriter bio ---------- */
    var lines = ['writes code.', 'breaks code.', 'fixes the code that broke.', 'debugging at 3am.', 'probably asleep.', 'touching grass (rarely).'];
    var typedEl = $('typed'), li = 0, ci = 0, del = false, started = false;
    function startTyping() { if (started) return; started = true; if (reduce) { typedEl.textContent = lines[0]; return; } tick(); }
    function tick() {
      var s = lines[li];
      typedEl.textContent = s.slice(0, ci);
      if (!del && ci < s.length) { ci++; setTimeout(tick, 70); }
      else if (!del) { del = true; setTimeout(tick, 1600); }
      else if (ci > 0) { ci--; setTimeout(tick, 35); }
      else { del = false; li = (li + 1) % lines.length; setTimeout(tick, 300); }
    }

    /* ---------- Helsinki clock ---------- */
    var clock = $('clock');
    function showTime() { clock.textContent = '🕒 ' + new Date().toLocaleTimeString('en-GB', { timeZone: 'Europe/Helsinki', hour: '2-digit', minute: '2-digit' }); }
    showTime(); setInterval(showTime, 10000);

    /* ---------- avatar easter egg ---------- */
    var clicks = 0, egg = $('egg'), av = $('avatar');
    var msgs = ['', 'hey.', 'stop that.', 'seriously.', 'ok fine.', 'wheee'];
    av.addEventListener('click', function () {
      clicks++;
      egg.textContent = msgs[Math.min(clicks, msgs.length - 1)];
      if (clicks >= 5) { av.classList.remove('spin'); void av.offsetWidth; av.classList.add('spin'); clicks = 0; setTimeout(function () { egg.textContent = ''; }, 1500); }
    });
    av.addEventListener('error', function () { if (av.getAttribute('src') !== 'avatar.png') av.src = 'avatar.png'; });

    /* ---------- animated tab: typing title + pulsing avatar favicon ---------- */
    (function () {
      var name = 'Tihvert', i = 0, back = false;
      function title() {
        document.title = (name.slice(0, i) || '​') + (i < name.length ? '_' : '');
        if (!back) { if (i < name.length) i++; else { back = true; setTimeout(title, 2500); return; } }
        else { if (i > 1) i--; else back = false; }
        setTimeout(title, back ? 90 : 180);
      }
      if (!reduce) title();

      var link = $('favicon'), img = new Image(), fc = document.createElement('canvas');
      fc.width = fc.height = 64; var fx = fc.getContext('2d'), ph = 0;
      img.onload = function () {
        if (reduce) return;
        setInterval(function () {
          ph += 0.25;
          fx.clearRect(0, 0, 64, 64);
          fx.save(); fx.beginPath(); fx.arc(32, 32, 26, 0, 6.3); fx.clip();
          fx.drawImage(img, 6, 6, 52, 52); fx.restore();
          fx.beginPath(); fx.arc(32, 32, 29, 0, 6.3);
          fx.lineWidth = 4; fx.strokeStyle = 'rgba(196,181,253,' + (0.35 + 0.35 * Math.sin(ph)) + ')'; fx.stroke();
          link.href = fc.toDataURL('image/png');
        }, 200);
      };
      img.src = 'favicon.png';
    })();

    /* ---------- sky: northern lights + twinkling stars + shooting stars ---------- */
    (function () {
      var ac = $('aurora'), a = ac.getContext('2d'), sc = $('bg'), s = sc.getContext('2d');
      var AW = 240, AH, W, H, dpr = Math.min(window.devicePixelRatio || 1, 2);
      // each band: vertical position, curtain height, colour, strength, wave frequency/speed/phase
      var BANDS = [
        { y: .34, h: .30, c: [110, 231, 183], a: .55, f: 1.0, s: .10, p: 0.0 },
        { y: .42, h: .26, c: [167, 139, 250], a: .45, f: 1.4, s: .07, p: 2.1 },
        { y: .26, h: .22, c: [125, 211, 252], a: .30, f: 0.8, s: .12, p: 4.2 }
      ];
      BANDS.forEach(function (b) {
        var g = document.createElement('canvas'); g.width = 1; g.height = 64;
        var x = g.getContext('2d'), grad = x.createLinearGradient(0, 0, 0, 64), c = b.c.join(',');
        grad.addColorStop(0, 'rgba(' + c + ',0)');
        grad.addColorStop(.75, 'rgba(' + c + ',.55)');
        grad.addColorStop(.93, 'rgba(' + c + ',1)');
        grad.addColorStop(1, 'rgba(' + c + ',0)');
        x.fillStyle = grad; x.fillRect(0, 0, 1, 64); b.sprite = g;
      });
      var stars = [], shooters = [], nextShot = 3;
      function size() {
        W = innerWidth; H = innerHeight;
        sc.width = W * dpr; sc.height = H * dpr;
        AH = Math.max(80, Math.round(AW * H / W)); ac.width = AW; ac.height = AH;
        stars = [];
        var n = Math.round(Math.min(220, W * H / 7000));
        for (var i = 0; i < n; i++) stars.push({ x: Math.random(), y: Math.random() * .85, r: Math.random() * 1.2 + .3, ph: Math.random() * 6.3, sp: Math.random() * 1.5 + .4, o: Math.random() * .6 + .25 });
      }
      size(); addEventListener('resize', size);

      function aurora(t) {
        a.clearRect(0, 0, AW, AH);
        a.globalCompositeOperation = 'lighter';
        BANDS.forEach(function (b) {
          for (var x = 0; x < AW; x++) {
            var u = x / AW;
            var y = AH * (b.y + .06 * Math.sin(u * 6 * b.f + t * b.s) + .035 * Math.sin(u * 13 * b.f - t * b.s * 1.7 + b.p));
            var h = AH * b.h * (.65 + .35 * Math.sin(u * 9 + t * .5 + b.p));
            var ray = .5 + .5 * Math.sin(u * 60 * b.f + t * 1.1 + b.p) * Math.sin(u * 21 - t * .35);
            var edge = Math.sin(Math.PI * Math.min(1, Math.max(0, u * 1.15 - .075)));
            a.globalAlpha = b.a * ray * edge;
            a.drawImage(b.sprite, 0, 0, 1, 64, x, y - h, 1.5, h);
          }
        });
        a.globalAlpha = 1; a.globalCompositeOperation = 'source-over';
      }

      function sky(t, dt) {
        s.setTransform(dpr, 0, 0, dpr, 0, 0);
        s.clearRect(0, 0, W, H);
        stars.forEach(function (p) {
          var tw = reduce ? 1 : .55 + .45 * Math.sin(t * p.sp + p.ph);
          s.globalAlpha = p.o * tw;
          s.fillStyle = '#e9e7ff';
          s.beginPath(); s.arc(p.x * W, p.y * H, p.r, 0, 6.3); s.fill();
        });
        s.globalAlpha = 1;
        if (reduce) return;
        nextShot -= dt;
        if (nextShot <= 0) {
          nextShot = 6 + Math.random() * 9;
          var ang = .35 + Math.random() * .3;
          shooters.push({ x: Math.random() * W * .7, y: Math.random() * H * .35, vx: Math.cos(ang) * 700, vy: Math.sin(ang) * 700, life: 1 });
        }
        shooters = shooters.filter(function (m) {
          m.x += m.vx * dt; m.y += m.vy * dt; m.life -= dt * 1.4;
          if (m.life <= 0) return false;
          var tx = m.x - m.vx * .12, ty = m.y - m.vy * .12;
          var g = s.createLinearGradient(m.x, m.y, tx, ty);
          g.addColorStop(0, 'rgba(255,255,255,' + m.life + ')'); g.addColorStop(1, 'rgba(196,181,253,0)');
          s.strokeStyle = g; s.lineWidth = 1.6; s.beginPath(); s.moveTo(m.x, m.y); s.lineTo(tx, ty); s.stroke();
          return true;
        });
      }

      var last = performance.now();
      function frame(now) {
        var t = now / 1000, dt = Math.min(.05, (now - last) / 1000); last = now;
        aurora(t); sky(t, dt);
        if (!reduce) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();

    /* ---------- sparkles around the name ---------- */
    (function () {
      if (reduce) return;
      var wrap = $('nameWrap');
      setInterval(function () {
        if (document.hidden) return;
        var sp = document.createElement('span');
        sp.className = 'sparkle'; sp.textContent = '✦';
        sp.style.left = (Math.random() * 100) + '%';
        sp.style.top = (Math.random() * 90 - 10) + '%';
        sp.style.fontSize = (7 + Math.random() * 7) + 'px';
        wrap.appendChild(sp);
        setTimeout(function () { sp.remove(); }, 1200);
      }, 380);
    })();

    /* ---------- 3D tilt card + glare (mouse only) ---------- */
    (function () {
      if (reduce || !finePointer) return;
      var tx = 0, ty = 0, cx = 0, cy = 0, gx = 50, gy = -10;
      addEventListener('mousemove', function (e) {
        tx = e.clientX / innerWidth - .5; ty = e.clientY / innerHeight - .5;
        var r = card.getBoundingClientRect();
        gx = (e.clientX - r.left) / r.width * 100; gy = (e.clientY - r.top) / r.height * 100;
      });
      (function loop() {
        cx += (tx - cx) * .08; cy += (ty - cy) * .08;
        card.style.transform = 'perspective(900px) rotateY(' + (cx * 14).toFixed(2) + 'deg) rotateX(' + (-cy * 14).toFixed(2) + 'deg)';
        card.style.setProperty('--gx', gx.toFixed(1) + '%'); card.style.setProperty('--gy', gy.toFixed(1) + '%');
        requestAnimationFrame(loop);
      })();
    })();

    /* ---------- custom cursor with sparkle trail (mouse only) ---------- */
    (function () {
      if (reduce || !finePointer) return;
      document.body.classList.add('fxcursor');
      var dot = $('cdot'), ring = $('cring'), fc = $('fx'), f = fc.getContext('2d');
      var mx = -100, my = -100, rx = -100, ry = -100, dots = [], dpr = Math.min(window.devicePixelRatio || 1, 2), lastX = 0, lastY = 0;
      function size() { fc.width = innerWidth * dpr; fc.height = innerHeight * dpr; }
      size(); addEventListener('resize', size);
      addEventListener('mousemove', function (e) {
        mx = e.clientX; my = e.clientY;
        dot.style.transform = 'translate3d(' + mx + 'px,' + my + 'px,0)';
        var d = Math.hypot(mx - lastX, my - lastY);
        if (d > 14) {
          lastX = mx; lastY = my;
          dots.push({ x: mx, y: my, vx: (Math.random() - .5) * 20, vy: Math.random() * 25 + 10, life: 1, r: Math.random() * 1.6 + .8, hue: Math.random() < .5 ? '196,181,253' : '110,231,183' });
        }
      });
      document.addEventListener('mouseover', function (e) { ring.classList.toggle('hover', !!e.target.closest('a, button, input, #gate, .avatar')); });
      document.addEventListener('mouseleave', function () { mx = my = -100; });
      var last = performance.now();
      (function loop(now) {
        var dt = Math.min(.05, ((now || last) - last) / 1000); last = now || last;
        rx += (mx - rx) * .18; ry += (my - ry) * .18;
        ring.style.transform = 'translate3d(' + rx + 'px,' + ry + 'px,0)';
        f.setTransform(dpr, 0, 0, dpr, 0, 0); f.clearRect(0, 0, innerWidth, innerHeight);
        dots = dots.filter(function (p) {
          p.life -= dt * 1.6; if (p.life <= 0) return false;
          p.x += p.vx * dt; p.y += p.vy * dt;
          f.globalAlpha = p.life; f.fillStyle = 'rgb(' + p.hue + ')';
          f.beginPath(); f.arc(p.x, p.y, p.r * p.life + .3, 0, 6.3); f.fill();
          return true;
        });
        f.globalAlpha = 1;
        requestAnimationFrame(loop);
      })();
    })();

    /* ---------- live Discord presence via Lanyard ---------- */
    var Presence = (function () {
      var box = $('presence'), sdot = $('sdot'), stxt = $('statusText'), cst = $('cstatus');
      var act = $('act'), actImg = $('actImg'), actIcon = $('actIcon'), actKind = $('actKind'), actName = $('actName'), actSub = $('actSub'), actTime = $('actTime');
      var spot = $('spot'), spotArt = $('spotArt'), spotSong = $('spotSong'), spotArtist = $('spotArtist'), spotBar = $('spotBar'), spotCur = $('spotCur'), spotDur = $('spotDur');
      var idle = $('pidle');
      var LABEL = { online: 'online', idle: 'idle', dnd: 'do not disturb', offline: 'offline' };
      var KIND = { 0: 'playing', 1: 'streaming', 2: 'listening to', 3: 'watching', 5: 'competing in' };
      var cur = null, ws = null, hb = null, retry = 0;

      function asset(img, appId) {
        if (!img) return '';
        if (img.indexOf('mp:external/') === 0) return 'https://media.discordapp.net/external/' + img.slice(12);
        if (img.indexOf('spotify:') === 0) return 'https://i.scdn.co/image/' + img.slice(8);
        if (/^\d+$/.test(img) && appId) return 'https://cdn.discordapp.com/app-assets/' + appId + '/' + img + '.png';
        return '';
      }
      function fmt(ms) {
        var s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
        return (h ? h + ':' + (m < 10 ? '0' : '') + m : m) + ':' + (x < 10 ? '0' : '') + x;
      }
      function find(list, test) { for (var i = 0; i < list.length; i++) if (test(list[i])) return list[i]; return null; }

      function render(d) {
        cur = d;
        if (!d || !d.discord_user) { box.hidden = true; sdot.hidden = true; stxt.hidden = true; return; }
        var st = d.discord_status || 'offline', label = LABEL[st] || st;
        sdot.hidden = false; sdot.className = 'sdot ' + st; sdot.title = label;
        stxt.hidden = false; stxt.className = 'st ' + st; stxt.textContent = '● ' + label;

        var u = d.discord_user;
        if (u.avatar) {
          var url = 'https://cdn.discordapp.com/avatars/' + u.id + '/' + u.avatar + (u.avatar.indexOf('a_') === 0 ? '.gif' : '.png') + '?size=256';
          if (av.dataset.live !== url) { av.dataset.live = url; av.src = url; }
        }

        var acts = d.activities || [];
        var custom = find(acts, function (x) { return x.type === 4; });
        cst.textContent = '';
        if (custom) {
          if (custom.emoji) {
            if (custom.emoji.id) {
              var em = document.createElement('img'); em.alt = '';
              em.src = 'https://cdn.discordapp.com/emojis/' + custom.emoji.id + (custom.emoji.animated ? '.gif' : '.png') + '?size=32';
              cst.appendChild(em);
            } else if (custom.emoji.name) cst.appendChild(document.createTextNode(custom.emoji.name));
          }
          if (custom.state) { var sp = document.createElement('span'); sp.textContent = custom.state; cst.appendChild(sp); }
        }

        var game = find(acts, function (x) { return x.type !== 4 && x.name !== 'Spotify'; });
        act.hidden = !game;
        if (game) {
          actKind.textContent = KIND[game.type] || 'playing';
          actName.textContent = game.name || '';
          actSub.textContent = [game.details, game.state].filter(Boolean).join(' · ');
          var src = asset(game.assets && game.assets.large_image, game.application_id);
          actImg.hidden = !src; actIcon.hidden = !!src;
          if (src && actImg.getAttribute('src') !== src) actImg.src = src;
        }

        var sp2 = d.listening_to_spotify && d.spotify;
        spot.hidden = !sp2;
        if (sp2) {
          spotSong.textContent = sp2.song || '';
          spotArtist.textContent = (sp2.artist || '').replace(/;/g, ',');
          if (sp2.album_art_url && spotArt.getAttribute('src') !== sp2.album_art_url) spotArt.src = sp2.album_art_url;
        }

        idle.hidden = !!(game || sp2);
        idle.textContent = st === 'offline' ? 'offline right now. probably asleep.' : 'not doing anything right now.';
        box.hidden = false;
        update();
      }

      function update() {
        if (!cur) return;
        var now = Date.now(), acts = cur.activities || [];
        var game = find(acts, function (x) { return x.type !== 4 && x.name !== 'Spotify'; });
        if (game && game.timestamps && game.timestamps.start) actTime.textContent = fmt(now - game.timestamps.start) + ' elapsed';
        else actTime.textContent = '';
        var sp = cur.listening_to_spotify && cur.spotify;
        if (sp && sp.timestamps) {
          var total = sp.timestamps.end - sp.timestamps.start, done = Math.min(total, now - sp.timestamps.start);
          spotBar.style.width = (total > 0 ? done / total * 100 : 0) + '%';
          spotCur.textContent = fmt(done); spotDur.textContent = fmt(total);
        }
      }
      setInterval(update, 1000);

      function connect() {
        try { ws = new WebSocket('wss://api.lanyard.rest/socket'); } catch (e) { return; }
        ws.onmessage = function (ev) {
          var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
          if (m.op === 1) {
            clearInterval(hb);
            hb = setInterval(function () { if (ws.readyState === 1) ws.send(JSON.stringify({ op: 3 })); }, m.d.heartbeat_interval);
            ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: DISCORD_ID } }));
          } else if (m.op === 0 && (m.t === 'INIT_STATE' || m.t === 'PRESENCE_UPDATE')) {
            retry = 0; render(m.d);
          }
        };
        ws.onclose = function () { clearInterval(hb); setTimeout(connect, Math.min(60000, 2000 * Math.pow(2, retry++))); };
      }

      return {
        render: render,
        start: function () {
          if (!DISCORD_ID || !window.fetch) return;
          fetch('https://api.lanyard.rest/v1/users/' + DISCORD_ID)
            .then(function (r) { return r.json(); })
            .then(function (j) { if (j && j.success) { render(j.data); connect(); } })
            .catch(function () { /* Lanyard down or not monitored: card simply has no live block */ });
        }
      };
    })();
    Presence.start();

    /* ---------- music: YouTube song or the original synthesized ambient loop ---------- */
    var Music = (function () {
      var player = $('player'), pp = $('pp'), title = $('plTitle'), bar = $('plBar'), prog = $('plProg'), vol = $('vol');
      var PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
      var PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';
      var mode = null, playing = false, ytp = null, titleSet = false;
      var ctx, master, step = 0;
      var v = 35;
      try { var sv = parseInt(localStorage.getItem('tihvert-vol'), 10); if (sv >= 0 && sv <= 100) v = sv; } catch (e) {}
      vol.value = v;

      function ui() {
        pp.innerHTML = playing ? PAUSE : PLAY;
        pp.setAttribute('aria-label', playing ? 'Pause music' : 'Play music');
        player.classList.toggle('paused', !playing);
      }
      function remember() { try { localStorage.setItem('tihvert-muted', playing ? '0' : '1'); } catch (e) {} }
      function wasMuted() { try { return localStorage.getItem('tihvert-muted') === '1'; } catch (e) { return false; } }

      // ---- original ambient loop, synthesized live (no audio file, no licensing) ----
      // Am7 - Fmaj7 - Cmaj7 - G6, slow and dreamy
      var chords = [[57, 60, 64, 67], [53, 57, 60, 64], [48, 55, 59, 64], [55, 59, 62, 64]];
      var BEAT = 0.42; // seconds per 8th note
      function hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
      function pad(notes, t, dur) {
        notes.forEach(function (n) {
          [0, 7].forEach(function (det) {
            var o = ctx.createOscillator(), g = ctx.createGain();
            o.type = 'triangle'; o.frequency.value = hz(n - 12); o.detune.value = det;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.022, t + 1.2);
            g.gain.linearRampToValueAtTime(0, t + dur);
            o.connect(g); g.connect(master.lp); o.start(t); o.stop(t + dur + 0.1);
          });
        });
      }
      function pluck(n, t) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = hz(n + 12);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.05, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
        o.connect(g); g.connect(master.delay); g.connect(master.lp); o.start(t); o.stop(t + 1.2);
      }
      function crackle() {
        var len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = Math.random() < 0.0008 ? (Math.random() * 2 - 1) * 0.5 : (Math.random() * 2 - 1) * 0.004;
        var s = ctx.createBufferSource(), g = ctx.createGain();
        s.buffer = buf; s.loop = true; g.gain.value = 0.35; s.connect(g); g.connect(master.lp); s.start();
      }
      function schedule() {
        var now = ctx.currentTime;
        while (master.next < now + 0.6) {
          var bar8 = Math.floor(step / 8) % chords.length, ch = chords[bar8], pos = step % 8;
          if (pos === 0) pad(ch, master.next, BEAT * 8 + 0.3);
          var pattern = [0, 2, 1, 3, 2, 1, 3, 2];
          if (pos !== 5 || Math.random() < 0.5) pluck(ch[pattern[pos]], master.next);
          master.next += BEAT; step++;
        }
      }
      function build() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain(); master.gain.value = 0;
        var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800; lp.Q.value = 0.4;
        var delay = ctx.createDelay(); delay.delayTime.value = BEAT * 3;
        var fb = ctx.createGain(); fb.gain.value = 0.35;
        delay.connect(fb); fb.connect(delay); delay.connect(lp);
        lp.connect(master); master.connect(ctx.destination);
        master.lp = lp; master.delay = delay; master.next = ctx.currentTime + 0.1;
        crackle();
      }
      function synthGain() { return playing ? v / 100 * 2.5 : 0; }
      function fade() { master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(synthGain(), ctx.currentTime, 0.6); }

      function play() {
        playing = true;
        if (mode === 'yt') { ytp.unMute(); ytp.setVolume(v); ytp.playVideo(); }
        else if (mode === 'synth') { if (ctx.state === 'suspended') ctx.resume(); fade(); }
        ui(); remember();
      }
      function pause() {
        playing = false;
        if (mode === 'yt') ytp.pauseVideo();
        else if (mode === 'synth') fade();
        ui(); remember();
      }
      pp.addEventListener('click', function () { if (mode) playing ? pause() : play(); });
      vol.addEventListener('input', function () {
        v = +vol.value;
        try { localStorage.setItem('tihvert-vol', String(v)); } catch (e) {}
        if (mode === 'yt' && ytp) ytp.setVolume(v);
        else if (mode === 'synth') fade();
      });

      // YouTube song mode: progress bar + real title
      setInterval(function () {
        if (mode !== 'yt' || !ytp || !ytp.getDuration) return;
        var d = ytp.getDuration(), c = ytp.getCurrentTime();
        prog.style.width = (d ? c / d * 100 : 0) + '%';
        if (!titleSet && !MUSIC_TITLE && ytp.getVideoData) {
          var vd = ytp.getVideoData();
          if (vd && vd.title) { title.textContent = vd.title; titleSet = true; }
        }
      }, 500);
      function startYouTube(id) {
        var holder = document.createElement('div'); holder.id = 'ytplayer';
        holder.style.cssText = 'position:fixed;width:1px;height:1px;left:-9999px;top:0;';
        document.body.appendChild(holder);
        window.onYouTubeIframeAPIReady = function () {
          new YT.Player('ytplayer', {
            videoId: id, width: 1, height: 1,
            playerVars: { autoplay: 1, loop: 1, playlist: id, controls: 0, playsinline: 1 },
            events: { onReady: function (e) {
              ytp = e.target; mode = 'yt';
              title.textContent = MUSIC_TITLE || 'loading…';
              bar.classList.remove('live'); player.classList.add('show');
              wasMuted() ? pause() : play();
            } }
          });
        };
        var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
      }

      ui();
      return {
        start: function () {
          if (MUSIC_YOUTUBE_ID) { startYouTube(MUSIC_YOUTUBE_ID); return; }
          try {
            build(); mode = 'synth';
            title.textContent = 'ambient loop · original';
            bar.classList.add('live'); player.classList.add('show');
            setInterval(schedule, 150); schedule();
            wasMuted() ? pause() : play();
          } catch (e) { /* no Web Audio: page still works silently */ }
        }
      };
    })();
  </script>
