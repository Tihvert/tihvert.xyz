<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tihvert</title>
  <meta name="description" content="Tihvert — developer from Finland.">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230b0b0c'/><text x='50%' y='55%' text-anchor='middle' dominant-baseline='middle' font-family='Arial' font-weight='700' font-size='34' fill='%23f4f4f5'>T</text></svg>">
  <style>
    :root {
      --bg: #0b0b0c;
      --text: #f4f4f5;
      --muted: #8a8a93;
      --line: #1f1f23;
      --hover: #151518;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 96px 20px 64px;
    }
    header { display: flex; align-items: center; gap: 16px; }
    .mark {
      width: 48px; height: 48px; flex: none;
      display: grid; place-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-weight: 700; font-size: 20px;
    }
    h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    .sub { color: var(--muted); font-size: 14px; }
    p.intro { margin-top: 32px; color: #c9c9ce; }

    h2 {
      margin-top: 48px;
      font-size: 12px; font-weight: 500;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted);
    }
    ul { list-style: none; margin-top: 12px; border-top: 1px solid var(--line); }
    li { border-bottom: 1px solid var(--line); }
    li > a, li > button {
      width: 100%;
      display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
      padding: 14px 4px;
      color: var(--text); text-decoration: none;
      background: none; border: 0; font: inherit; text-align: left; cursor: pointer;
      transition: background .15s, padding .15s;
    }
    li > a:hover, li > button:hover, li > a:focus-visible, li > button:focus-visible {
      background: var(--hover); padding-left: 10px; padding-right: 10px; outline: none;
    }
    .meta { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .arrow { color: var(--muted); }

    footer { margin-top: 56px; color: #4a4a52; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="mark" aria-hidden="true">T</div>
      <div>
        <h1>Tihvert</h1>
        <div class="sub">Developer · Finland</div>
      </div>
    </header>

    <p class="intro">I build software and games. This is where my links live.</p>

    <h2>Links</h2>
    <ul>
      <li><a href="https://github.com/Tihvert" target="_blank" rel="noopener">GitHub <span class="meta">@Tihvert <span class="arrow">↗</span></span></a></li>
      <li><a href="https://discord.com/users/1015157576687698030" target="_blank" rel="noopener">Discord <span class="meta">profile <span class="arrow">↗</span></span></a></li>
    </ul>

    <h2>Projects</h2>
    <ul>
      <li><a href="https://tihvert.github.io/FATEBOUND/" target="_blank" rel="noopener">FATEBOUND <span class="meta">Roblox game <span class="arrow">↗</span></span></a></li>
    </ul>

    <h2>Minecraft server</h2>
    <ul>
      <li><button type="button" data-copy="mc.tihvert.xyz">Java &amp; Bedrock <span class="meta">mc.tihvert.xyz</span></button></li>
      <li><button type="button" data-copy="54025">Bedrock port <span class="meta">54025</span></button></li>
    </ul>

    <footer>© Tihvert</footer>
  </main>

  <script>
    document.querySelectorAll('button[data-copy]').forEach(function (b) {
      b.addEventListener('click', function () {
        var m = b.querySelector('.meta'), t = m.textContent;
        navigator.clipboard.writeText(b.dataset.copy).then(function () {
          m.textContent = 'copied';
          setTimeout(function () { m.textContent = t; }, 1200);
        }).catch(function () {});
      });
    });
  </script>
</body>
</html>
